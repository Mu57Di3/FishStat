name: Create Release Archive

on:
  release:
    types: [published]

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Создаем архив с динамическим именем репозитория
      - name: Create Zip Archive
        run: |
                    REPO_NAME=$(basename ${{ github.repository }})
                    ARCHIVE_DIR="release_tmp/$REPO_NAME"
          
          # Создаем структуру: release_tmp/имя_проекта
                    mkdir -p "$ARCHIVE_DIR"
          
          # Копируем все файлы, кроме временной папки и служебной папки .git
                    rsync -rr --exclude='release_tmp' --exclude='.git' ./ "$ARCHIVE_DIR/"
          
          # Переходим в папку сборки и создаем архив
                    cd release_tmp
                    zip -r "../$REPO_NAME.zip" "$REPO_NAME"
                    tar -czf "../$REPO_NAME.tar.gz" "$REPO_NAME"

      # Загружаем созданный файл в релиз
      - name: Upload Archive to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ github.event.repository.name }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
